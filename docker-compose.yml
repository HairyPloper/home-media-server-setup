name: ${COMPOSE_PROJECT_NAME:-home-media-server}

services:
  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--api.insecure=true"
    ports:
       - "8080:80"      # web (HTTP) for testing
       - "8443:443"     # websecure (HTTPS) for testing
       - "8888:8080"    # Traefik dashboard
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/traefik:/etc/traefik" # Traefik config & data
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2381-ls489
    container_name: jackett
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/jackett:/config"
      - "${SERVER_ROOT:-D:/server}/torrents:/downloads"
    ports:
      - "8081:9117"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jackett.rule=Host(`jackett.local`)"
      - "traefik.http.routers.jackett.entrypoints=web"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/prowlarr:/config"
    ports:
      - "8082:9696"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.local`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/sonarr:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
      - "${SERVER_ROOT:-D:/server}/torrents:/data/torrents"
    ports:
      - "8083:8989"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.local`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/radarr:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
      - "${SERVER_ROOT:-D:/server}/torrents:/data/torrents"
    ports:
      - "8084:7878"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.local`)"
      - "traefik.http.routers.radarr.entrypoints=web"
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls38
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/lidarr:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
      - "${SERVER_ROOT:-D:/server}/torrents:/data/torrents"
    ports:
      - "8085:8686"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.local`)"
      - "traefik.http.routers.lidarr.entrypoints=web"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls357
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/bazarr:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
      - "${SERVER_ROOT:-D:/server}/torrents:/data/torrents"
    ports:
      - "8086:6767"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.local`)"
      - "traefik.http.routers.bazarr.entrypoints=web"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls42
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/jellyfin:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
    ports:
      - "8087:8096"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.local`)"
      - "traefik.http.routers.jellyfin.entrypoints=web"
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:1.43.3.10861-07dfddaeb-ls319
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/plex:/config"
      - "${SERVER_ROOT:-D:/server}/media:/data/media"
    ports:
      - "8088:32400"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.local`)"
      - "traefik.http.routers.plex.entrypoints=web"
    restart: unless-stopped

  ombi:
    image: lscr.io/linuxserver/ombi:v4.53.10-ls265
    container_name: ombi
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/ombi:/config"
    ports:
      - "8089:3579"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ombi.rule=Host(`ombi.local`)"
      - "traefik.http.routers.ombi.entrypoints=web"
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:v1.35.0-ls159
    container_name: overseerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/overseerr:/config"
    ports:
      - "8090:5055"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host(`overseerr.local`)"
      - "traefik.http.routers.overseerr.entrypoints=web"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "8093:8191"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.local`)"
      - "traefik.http.routers.flaresolverr.entrypoints=web"
    restart: unless-stopped

  heimdall:
    image: lscr.io/linuxserver/heimdall:v2.8.1-ls358
    container_name: heimdall
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/heimdall:/config"
    ports:
      - "8094:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heimdall.rule=Host(`heimdall.local`)"
      - "traefik.http.routers.heimdall.entrypoints=web"
      - "traefik.http.services.heimdall.loadbalancer.server.port=80"
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls357
    container_name: transmission
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=${TZ:-Etc/UTC}
      - USER=${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      - PASS=${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      - RPC_ENABLED=true
      - RPC_WHITELIST_ENABLED=false
    volumes:
      - "${SERVER_ROOT:-D:/server}/configs/transmission:/config"
      - "${SERVER_ROOT:-D:/server}/torrents:/data/torrents"
      - "${SERVER_ROOT:-D:/server}/torrents/incomplete:/data/torrents/incomplete"
      - "${SERVER_ROOT:-D:/server}/watch:/watch"
    ports:
      - "9095:9091"
      - "51414:51413"
      - "51414:51413/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.local`)"
      - "traefik.http.routers.transmission.entrypoints=web"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    restart: unless-stopped
